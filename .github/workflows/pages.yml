name: Pages

# Builds the static site and deploys it to GitHub Pages (Settings → Pages → Source:
# GitHub Actions) on every push to main, daily (to refresh the build-time GitHub
# snapshot, scripts/sync-github.mjs) and by hand. Lint, format check and tests gate it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *" # daily, ~5am Toronto
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # The previous GitHub snapshot, so a failed API call keeps the last good data
      # instead of shipping a day without it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/data/github.generated.json
          key: github-snapshot-${{ github.run_id }}
          restore-keys: github-snapshot-

      # Only the sync gets the token (it raises the API limit and enables the
      # contribution calendar). `npm run build` would rerun the sync through prebuild
      # without it and keep the previous snapshot, so build with next directly.
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx next build
      - run: npm run check:head

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/data/github.generated.json
          key: github-snapshot-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  # Only the deploy job may write to Pages; the build (npm ci, third-party scripts) can't.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
