name: Deploy

# Builds the static site and publishes out/ to the gh-pages branch.
# The daily run refreshes the build-time GitHub snapshot (scripts/sync-github.mjs), so
# repo metadata and the "git log · 12w" sparkline stay current without visitors ever
# calling the GitHub API. It deploys whatever is on main at that time.
on:
  schedule:
    - cron: "17 9 * * *" # daily, ~5am Toronto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # prebuild runs the GitHub sync; the token raises the API limit and enables the
      # contribution calendar.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          commit_message: "deploy: ${{ github.event_name }} build"
