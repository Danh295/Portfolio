name: Repo check

# Compares the public repos Danny owns or contributes to with the ones src/data/projects.js
# links (scripts/check-repos.mjs) and fails when one is missing from the site, or a linked one
# is renamed, archived or gone, so GitHub emails the failed run. It is its own workflow, so a
# red run here never touches the deploy (a red Pages run still means nothing was deployed), and
# nothing may require it as a check. Repos chosen to stay off the site: scripts/repo-check.json.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * *" # daily, a few minutes after the Pages deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The token lets the check read the repos you contributed to (GraphQL); the script has no
      # dependencies, so there is no npm ci.
      - run: node scripts/check-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
